<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

/* ================= CONSTANTS ================= */
const DAY_ORDER = ["segunda","terca","quarta","quinta","sexta","sabado","domingo"];
const DAY_LABEL = {segunda:"Segunda-feira",terca:"Terça-feira",quarta:"Quarta-feira",quinta:"Quinta-feira",sexta:"Sexta-feira",sabado:"Sábado",domingo:"Domingo"};
const DAY_SHORT = {segunda:"Seg",terca:"Ter",quarta:"Qua",quinta:"Qui",sexta:"Sex",sabado:"Sáb",domingo:"Dom"};
const DAY_KEY_FROM_LABEL = {"Segunda-feira":"segunda","Terça-feira":"terca","Quarta-feira":"quarta","Quinta-feira":"quinta","Sexta-feira":"sexta","Sábado":"sabado","Domingo":"domingo"};

/* ================= HELPERS ================= */
const pad = n => String(n).padStart(2,"0");
function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function weekdayKey(date=new Date()){ return ["domingo","segunda","terca","quarta","quinta","sexta","sabado"][date.getDay()]; }
function normalize(s){ return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,""); }
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ================= PDF PARSING ================= */

// Groups positioned text/word items into reconstructed lines, inserting a
// tab character where a large horizontal gap suggests a new table column.
// Shared by both the native-text path and the OCR path.
function buildLinesFromItems(items, yTolerance, gapThreshold){
  const lines = [];
  const sorted = [...items].sort((a,b) => a.y - b.y || a.x - b.x);
  for (const item of sorted){
    let line = lines.find(l => Math.abs(l.y - item.y) <= yTolerance);
    if (!line){ line = { y:item.y, items:[] }; lines.push(line); }
    line.items.push(item);
  }
  return lines.map(l => {
    l.items.sort((a,b) => a.x - b.x);
    let text = ""; let prevEnd = null;
    for (const it of l.items){
      if (prevEnd !== null){
        const gap = it.x - prevEnd;
        text += gap > gapThreshold ? "\t" : (text.endsWith(" ") ? "" : " ");
      }
      text += it.text;
      prevEnd = it.x1 != null ? it.x1 : it.x + (it.w || 0);
    }
    return text.trim();
  }).filter(Boolean);
}

async function extractNativeTextLines(pdf){
  const allLines = [];
  for (let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const items = content.items
      .map(i => ({ text:i.str, x:i.transform[4], y:-i.transform[5], w:i.width||0 })) // flip y so both paths sort top-to-bottom
      .filter(i => i.text.trim() !== "");
    allLines.push(...buildLinesFromItems(items, 2.5, 28));
  }
  return allLines;
}

async function renderPageToCanvas(pdf, p, scale){
  const page = await pdf.getPage(p);
  const viewport = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;
  if (!canvas.width || !canvas.height){
    throw new Error(`canvas com dimensões inválidas (${canvas.width}x${canvas.height})`);
  }
  return canvas;
}

async function extractLinesViaOCR(pdf, onProgress){
  if (typeof Tesseract === 'undefined'){
    throw new Error("Tesseract.js não carregou (biblioteca de OCR indisponível — verifique a conexão ou se algum bloqueador de scripts está ativo).");
  }
  const numPages = pdf.numPages;
  const SCALE = 2.0;
  const BATCH_SIZE = Math.min(4, numPages); // how many pages are held in memory at once

  const results = new Array(numPages);
  let completed = 0;

  let workers;
  try{
    workers = await Promise.all(
      Array.from({ length: BATCH_SIZE }, () => Tesseract.createWorker('por', 1))
    );
  } catch(err){
    throw new Error(`Falha ao iniciar o motor de OCR: ${err && err.message ? err.message : String(err)}`);
  }

  try{
    for (let start=1; start<=numPages; start+=BATCH_SIZE){
      const end = Math.min(start + BATCH_SIZE - 1, numPages);

      // Render only this small batch of pages to canvases, one at a time
      // (pdf.js in disableWorker mode isn't safe for concurrent rendering).
      const batchCanvases = [];
      for (let p=start; p<=end; p++){
        if (onProgress) onProgress({ status: `preparando página ${p}/${numPages}` });
        try{
          batchCanvases.push(await renderPageToCanvas(pdf, p, SCALE));
        } catch(err){
          throw new Error(`Falha ao renderizar a página ${p}: ${err && err.message ? err.message : String(err)}`);
        }
      }

      // OCR this batch in parallel (independent images, safe to parallelize).
      await Promise.all(batchCanvases.map(async (canvas, i) => {
        const pageNum = start + i;
        const worker = workers[i % workers.length];
        let data;
        try{
          const result = await worker.recognize(canvas);
          data = result.data;
        } catch(err){
          throw new Error(`Falha no OCR da página ${pageNum}: ${err && err.message ? err.message : String(err)}`);
        }
        const words = (data.words || []).map(w => ({
          text: w.text, x: w.bbox.x0, x1: w.bbox.x1, y: (w.bbox.y0 + w.bbox.y1) / 2,
        })).filter(w => w.text && w.text.trim());
        results[pageNum - 1] = buildLinesFromItems(words, 12, 55);
        completed++;
        if (onProgress) onProgress({ status: `ocr ${completed}/${numPages} páginas` });
      }));

      // Release this batch's canvases before moving on, so memory doesn't
      // build up across a long document.
      for (const c of batchCanvases){ c.width = 0; c.height = 0; }
    }
  } finally {
    await Promise.all(workers.map(w => w.terminate().catch(()=>{})));
  }

  return results.flat();
}

async function extractLinesFromPdf(file, onProgress){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf, disableWorker: true, isEvalSupported: false }).promise;
  let lines = await extractNativeTextLines(pdf);
  const totalChars = lines.join("").length;
  if (totalChars < 200){
    // No real text layer found (common with PDFs exported from design tools
    // like Canva, where text is flattened into vector shapes). Fall back to
    // rendering each page as an image and reading it with OCR.
    if (onProgress) onProgress({ status: "sem texto — usando OCR" });
    lines = await extractLinesViaOCR(pdf, onProgress);
  }
  return lines;
}

function parseDietText(allLines){
  const dayHeaderRegex = /^(Segunda-Feira|Segunda-feira|Terça-Feira|Terça-feira|Quarta-Feira|Quarta-feira|Quinta-Feira|Quinta-feira|Sexta-Feira|Sexta-feira|Sábado|Domingo)\s*\|\s*([\d.,]+)\s*calorias$/i;
  const mealHeaderRegexA = /^(Café da manhã|Almoço|Jantar)\s*(\(op[cç][aã]o\s*(\d)\))?\s*~\s*([\d.,]+)\s*Kcal$/i;
  const mealHeaderRegexB = /^(Café da manhã|Almoço|Jantar)\s*-?\s*([\d.,]+)\s*Kcal\s*(\(op[cç][aã]o\s*(\d)\))?$/i;
  function matchMealHeader(line){
    let m = line.match(mealHeaderRegexA);
    if (m) return { type: m[1], kcal: m[4], opt: m[3] };
    m = line.match(mealHeaderRegexB);
    if (m) return { type: m[1], kcal: m[2], opt: m[4] };
    return null;
  }
  const subHeaderRegex = /^•?\s*Op[cç][oõ]es de substitui[cç][aã]o para (.+):$/i;
  const dayNamesForFasting = ["Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado","Domingo"];

  let kcal = null, period = null;
  for (let i=0;i<allLines.length;i++){
    const l = allLines[i];
    if (/^\d{2}\/\d{2}\s*a\s*\d{2}\/\d{2}$/i.test(l)) period = l;
    if (/^\d[\d.]*$/.test(l) && allLines[i+1] && /^kcal$/i.test(allLines[i+1].trim())) kcal = l.replace(/\./g,"");
  }

  const fasting = {};
  const fastIdx = allLines.findIndex(l => /cronograma\s+jejum/i.test(l));
  if (fastIdx >= 0){
    for (let i=fastIdx; i<Math.min(fastIdx+50, allLines.length); i++){
      const l = allLines[i];
      const dayMatch = dayNamesForFasting.find(d => l.toLowerCase().startsWith(d.toLowerCase()));
      if (dayMatch){
        const rest = l.slice(dayMatch.length);
        const hoursMatch = rest.match(/(\d+)\s*horas/i);
        const mealsMatch = rest.match(/(\d(?:\s*ou\s*\d)?)\s*$/);
        if (hoursMatch){
          fasting[DAY_KEY_FROM_LABEL[dayMatch]] = { hours: parseInt(hoursMatch[1],10), meals: mealsMatch ? mealsMatch[1].trim() : "" };
        }
      }
    }
  }

  const menu = {};
  let curDayKey = null, curMeal = null, curItem = null;

  for (let i=0;i<allLines.length;i++){
    const l = allLines[i].trim();
    if (!l) continue;

    const dh = l.match(dayHeaderRegex);
    if (dh){
      const label = dh[1].replace(/-Feira$/,"-feira");
      curDayKey = DAY_KEY_FROM_LABEL[label] || DAY_KEY_FROM_LABEL[dh[1]];
      if (curDayKey && !menu[curDayKey]) menu[curDayKey] = { breakfast:null, lunch:null, dinner:[] };
      curMeal = null; curItem = null;
      continue;
    }
    if (!curDayKey) continue;

    const mh = matchMealHeader(l);
    if (mh){
      const type = mh.type.toLowerCase();
      const kcalVal = parseInt(mh.kcal.replace(/\./g,""),10);
      if (type.startsWith("café")){
        menu[curDayKey].breakfast = { kcal:kcalVal, items:[] };
        curMeal = menu[curDayKey].breakfast;
      } else if (type.startsWith("almo")){
        menu[curDayKey].lunch = { kcal:kcalVal, items:[] };
        curMeal = menu[curDayKey].lunch;
      } else if (type.startsWith("jantar")){
        const opt = { label: mh.opt ? `Opção ${mh.opt}` : `Opção ${menu[curDayKey].dinner.length+1}`, kcal:kcalVal, items:[] };
        menu[curDayKey].dinner.push(opt);
        curMeal = opt;
      }
      curItem = null;
      continue;
    }

    const sh = l.match(subHeaderRegex);
    if (sh && curMeal){
      const target = normalize(sh[1]);
      curItem = curMeal.items.find(it => normalize(it.food) === target)
             || curMeal.items.find(it => normalize(it.food).includes(target) || target.includes(normalize(it.food)));
      continue;
    }

    if (curItem && /-\s*ou\s*-/i.test(l)){
      const alts = l.split(/-\s*ou\s*-/i).map(s=>s.trim()).filter(Boolean);
      curItem.subs = curItem.subs || [];
      for (const alt of alts){
        const m = alt.match(/^(.*?)\s-\s(\d.+)$/);
        if (m) curItem.subs.push({ name:m[1].trim(), qty:m[2].trim() });
        else curItem.subs.push({ name:alt, qty:"" });
      }
      curItem = null;
      continue;
    }
    if (curItem && !l.includes("\t") && /^(.+?)\s-\s\d.+$/.test(l)){
      const m = l.match(/^(.*?)\s-\s(\d.+)$/);
      if (m){
        curItem.subs = curItem.subs || [];
        curItem.subs.push({ name:m[1].trim(), qty:m[2].trim() });
        curItem = null;
        continue;
      }
    }

    if (curMeal && l.includes("\t")){
      const parts = l.split("\t").map(s=>s.trim()).filter(Boolean);
      if (parts.length >= 2){
        const qty = parts[parts.length-1];
        const name = parts.slice(0,-1).join(" ");
        if (name && /\d/.test(qty)){
          curMeal.items.push({ food:name, qty, subs:[] });
          curItem = null;
        }
      }
    }
  }

  const dayCount = Object.keys(menu).length;
  const itemCount = Object.values(menu).reduce((acc,d) => {
    let n = 0;
    if (d.breakfast) n += d.breakfast.items.length;
    if (d.lunch) n += d.lunch.items.length;
    d.dinner.forEach(o => n += o.items.length);
    return acc+n;
  }, 0);

  return { kcal, period, fasting, menu, stats: { dayCount, itemCount, fastingDays: Object.keys(fasting).length } };
}

/* ================= STORAGE (browser localStorage — works on any host) ================= */
async function loadAllDiets(){
  const diets = {};
  try{
    for (let i=0; i<localStorage.length; i++){
      const key = localStorage.key(i);
      if (key && key.startsWith("diet:")){
        const kcal = key.replace("diet:","");
        if (!isValidKcalKey(kcal)) continue;
        const val = localStorage.getItem(key);
        if (val) diets[kcal] = JSON.parse(val);
      }
    }
  }catch(e){ console.error(e); }
  return diets;
}
async function saveDiet(kcal, data){
  try{ localStorage.setItem(`diet:${kcal}`, JSON.stringify(data)); }catch(e){ console.error(e); }
}
async function deleteDiet(kcal){
  try{ localStorage.removeItem(`diet:${kcal}`); }catch(e){}
}
async function loadSelectedKcal(){
  try{ const v = localStorage.getItem("selectedKcal"); return v ? JSON.parse(v) : null; }catch(e){ return null; }
}
async function saveSelectedKcal(kcal){
  try{ localStorage.setItem("selectedKcal", JSON.stringify(kcal)); }catch(e){}
}
async function loadLastMeal(){
  try{ const v = localStorage.getItem("lastMeal"); return v ? JSON.parse(v) : null; }catch(e){ return null; }
}
async function saveLastMeal(entry){
  try{ localStorage.setItem("lastMeal", JSON.stringify(entry)); }catch(e){}
}
async function clearLastMeal(){
  try{ localStorage.removeItem("lastMeal"); }catch(e){}
}

  selectedKcal: null,
  selectedDay: weekdayKey(),
  lastMeal: null,      // { dateKey, time }
  now: new Date(),
  loading: false,
  loadError: null,
  openFood: {},        // id -> bool (expanded substitutions)
  dinnerOptIdx: {},    // dayKey -> index
  inputTime: (() => { const d=new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; })(),
  isAdmin: false,
  showManage: false,
  showManualImport: false,
};

/* ================= RENDER ================= */
function foodRowHtml(item, idKey){
  const hasSubs = item.subs && item.subs.length > 0;
  const open = !!state.openFood[idKey];
  return `
    <div class="foodrow ${hasSubs?'has-subs':''}" ${hasSubs?`data-action="toggle-food" data-id="${idKey}"`:''}>
      <div class="between">
        <div style="flex:1;min-width:0;">
          <div class="foodname">${escapeHtml(item.food)}</div>
          <div class="foodqty">${escapeHtml(item.qty)}</div>
        </div>
        ${hasSubs?`<svg class="chev ${open?'open':''}" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>`:''}
      </div>
      ${hasSubs && open ? `
        <div class="subs">
          <div class="sublabel">Pode trocar por</div>
          ${item.subs.map(s => `<div class="subitem"><span>${escapeHtml(s.name)}</span><span class="qty">${escapeHtml(s.qty)}</span></div>`).join("")}
        </div>` : ''}
    </div>`;
}

function mealBlockHtml(title, option, idPrefix){
  if (!option) return `<div class="card"><div class="section-title"><h3 style="font-size:17px;">${title}</h3></div><p class="muted" style="font-size:13.5px;">Não encontrado nesse PDF.</p></div>`;
  return `
    <div class="card">
      <div class="between" style="margin-bottom:4px;">
        <h3 style="font-size:17px;">${title}</h3>
        <span class="kcaltag">~${option.kcal} kcal</span>
      </div>
      <div>${option.items.map((it,i) => foodRowHtml(it, `${idPrefix}-${i}`)).join("")}</div>
    </div>`;
}

function mealWithOptionsHtml(title, options, dayKey){
  if (!options || options.length === 0) return mealBlockHtml(title, null, `${dayKey}-jantar`);
  const idx = state.dinnerOptIdx[dayKey] || 0;
  const option = options[Math.min(idx, options.length-1)];
  return `
    <div class="card">
      <div class="between" style="margin-bottom:12px;">
        <h3 style="font-size:17px;">${title}</h3>
        <span class="kcaltag">~${option.kcal} kcal</span>
      </div>
      ${options.length>1 ? `<div class="opt-toggle">${options.map((o,i)=>`<button class="opt-btn ${i===idx?'active':''}" data-action="set-dinner-opt" data-day="${dayKey}" data-idx="${i}">${escapeHtml(o.label)}</button>`).join("")}</div>` : ''}
      <div>${option.items.map((it,i) => foodRowHtml(it, `${dayKey}-jantar-${idx}-${i}`)).join("")}</div>
    </div>`;
}

function dayAfter(date){
  const next = new Date(date);
  next.setDate(next.getDate() + 1);
  return next;
}

function fastingCardHtml(){
  const diet = state.selectedKcal ? state.diets[state.selectedKcal] : null;

  // The fasting schedule lists, for each day, the target for the fast that
  // BREAKS on that day (started from the previous day's last meal) — e.g.
  // "Sábado: 18h" is the fast counted from Friday's last meal. So the right
  // target is always the day AFTER the reference point, never simply
  // "today" — otherwise logging Friday's dinner while it's still Friday
  // would wrongly show Friday's own 14h instead of Saturday's 18h.
  let lastMealDate = null;
  if (state.lastMeal){
    const [y,mo,da] = state.lastMeal.dateKey.split("-").map(Number);
    const [h,m] = state.lastMeal.time.split(":").map(Number);
    lastMealDate = new Date(y, mo-1, da, h, m, 0, 0);
  }
  const referenceDate = lastMealDate || state.now;
  const targetDayKey = weekdayKey(dayAfter(referenceDate));
  const target = diet && diet.fasting[targetDayKey] ? diet.fasting[targetDayKey] : null;

  let body;
  if (!diet){
    body = `<p class="muted" style="font-size:14px;">Selecione uma dieta abaixo para acompanhar o jejum.</p>`;
  } else if (!target){
    body = `<p class="muted" style="font-size:14px;">Não encontrei a meta de jejum de ${DAY_LABEL[targetDayKey]} nesse PDF.</p>`;
  } else if (!lastMealDate){
    body = `
      <p class="muted" style="font-size:14px;margin-bottom:12px;">Registre o horário da sua última refeição pra acompanhar o jejum.</p>
      <div class="row">
        <input type="time" id="mealTimeInput" value="${state.inputTime}" style="flex:1;" />
        <button class="btn" data-action="register-meal">Registrar</button>
      </div>`;
  } else {
    const elapsedMs = state.now - lastMealDate;
    const elapsedH = Math.max(0, Math.floor(elapsedMs/3600000));
    const elapsedM = Math.max(0, Math.floor((elapsedMs%3600000)/60000));
    const pct = Math.min(100, (elapsedMs/(target.hours*3600000))*100);
    const done = elapsedMs >= target.hours*3600000;
    const breakDate = new Date(lastMealDate.getTime() + target.hours*3600000);
    body = `
      <div class="between" style="align-items:flex-end;margin-bottom:2px;">
        <div><span style="font-family:Fraunces,serif;font-size:34px;font-weight:600;">${elapsedH}h${pad(elapsedM)}</span><span class="muted" style="font-size:14px;margin-left:8px;">de jejum</span></div>
        <span class="muted" style="font-size:13px;">meta ${target.hours}h</span>
      </div>
      <div class="progress"><div class="progress-fill ${done?'done':''}" style="width:${pct}%;"></div></div>
      ${done
        ? `<div class="banner mint">✓ Jejum concluído — pode comer!</div>`
        : `<div class="banner pink">Libera às <strong style="color:var(--logo-dark);">${pad(breakDate.getHours())}:${pad(breakDate.getMinutes())}</strong></div>`}
      <div class="between" style="font-size:13px;">
        <span class="muted">Última refeição ${state.lastMeal.dateKey!==todayKey()?'ontem ':''}às ${state.lastMeal.time}</span>
        <span class="muted" style="cursor:pointer;text-decoration:underline dotted;" data-action="clear-meal">corrigir</span>
      </div>`;
  }

  return `
    <div class="card">
      <div class="section-title"><h2 style="font-size:18px;">Jejum de hoje</h2></div>
      <p class="muted" style="font-size:13px;margin:2px 0 14px;">${target?`Meta de ${target.hours}h (cronograma de ${DAY_LABEL[targetDayKey]}) · ${target.meals} refeições`:DAY_LABEL[weekdayKey()]}</p>
      ${body}
    </div>`;
}

function dietSelectorHtml(){
  const kcalKeys = Object.keys(state.diets).filter(isValidKcalKey).sort((a,b)=>Number(a)-Number(b));
  const chips = kcalKeys.map(k => `<div class="chip ${state.selectedKcal===k?'active':''}" data-action="select-kcal" data-kcal="${k}">${Number(k).toLocaleString('pt-BR')} kcal</div>`).join("");
  return `
    <div>
      <div class="scrollrow" style="margin-bottom:8px;">
        ${chips}
      </div>
      <input type="file" id="pdfInput" accept="application/pdf" multiple style="display:none;" />
      ${state.isAdmin ? `
        ${!SHARED_SYNC_ENABLED ? `<p class="muted" style="font-size:11.5px;margin:4px 0 0;">Sincronização com outros aparelhos ainda não configurada (JSONBIN_ID/JSONBIN_KEY vazios no código).</p>` : ''}
        ${state.loadError ? `<p style="color:var(--accent);font-size:12.5px;margin:4px 0 0;">${escapeHtml(state.loadError)}</p>` : ''}
        ${state.loading ? `<p class="muted" style="font-size:11.5px;margin:4px 0 0;">Se o PDF não tiver texto selecionável, o app lê por OCR (imagem) — pode levar de 30s a 2min por arquivo.</p>` : ''}
        ${state.debugDumps && Object.keys(state.debugDumps).length > 0 ? `
          <div class="card" style="margin-top:10px;">
            <p class="muted" style="font-size:12.5px;margin-bottom:8px;">Não consegui ler o cardápio desses arquivos. Copie o texto abaixo e cole aqui no chat pra eu ajustar a leitura:</p>
            ${Object.keys(state.debugDumps).map(name => `
              <div style="margin-bottom:10px;">
                <div class="between" style="margin-bottom:4px;">
                  <span style="font-size:12.5px;font-weight:600;">${escapeHtml(name)}</span>
                  <span style="font-size:12px;color:var(--accent);cursor:pointer;" data-action="copy-debug" data-name="${escapeHtml(name)}">copiar</span>
                </div>
                <textarea readonly style="width:100%;height:90px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:11px;font-family:monospace;padding:8px;" onclick="this.select()">${escapeHtml(state.debugDumps[name].slice(0,4000))}</textarea>
              </div>`).join("")}
          </div>` : ''}
        <div class="card" style="margin-top:8px;padding:14px;">
          <button class="btn" data-action="open-upload" style="width:100%;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px;">${state.loading?`<span class="spinner"></span> ${state.loadProgress||''}`:'+ Adicionar PDFs'}</button>
          <div style="margin-bottom:10px;">
            <span class="muted" style="font-size:12.5px;cursor:pointer;text-decoration:underline dotted;" data-action="toggle-manual-import">${state.showManualImport?'fechar importação manual':'importar dieta manualmente (colar JSON)'}</span>
          </div>
          ${state.showManualImport ? `
            <div style="margin-bottom:10px;">
              <p class="muted" style="font-size:12px;margin-bottom:6px;">Cole aqui o JSON que eu te mandar no chat (quando o PDF não puder ser lido automaticamente) e toque em Importar.</p>
              <textarea id="manualImportBox" placeholder='{"kcal":"1300","period":"07/09 a 13/09","fasting":{...},"menu":{...}}' style="width:100%;height:110px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:11px;font-family:monospace;padding:8px;margin-bottom:8px;"></textarea>
              <button class="btn" data-action="import-manual" style="width:100%;">Importar</button>
            </div>
          ` : ''}
          <div class="diet-manage" style="margin-top:0;">${kcalKeys.length} dieta(s) salva(s) · <span data-action="toggle-manage">gerenciar</span> · <span data-action="admin-logout">sair da área da administradora</span></div>
          ${state.showManage ? `<div style="margin-top:10px;">${kcalKeys.map(k=>`<div class="between" style="padding:6px 0;font-size:13.5px;border-top:1px solid var(--border);"><span>${Number(k).toLocaleString('pt-BR')} kcal — ${state.diets[k].stats.dayCount} dias lidos</span><span style="color:var(--accent);cursor:pointer;" data-action="remove-kcal" data-kcal="${k}">remover</span></div>`).join("")}</div>` : ''}
        </div>
      ` : ''}
    </div>`;
}

        <div class="banner pink">Jejum de 24h: a quebra é feita em <strong style="color:var(--logo-dark);">uma única refeição</strong>, com todas as calorias do dia.</div>

/* ================= EVENTS ================= */
function attachEvents(){
  document.getElementById("app").onclick = async (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.dataset.action;

    if (action === "toggle-food"){
      const id = el.dataset.id;
      state.openFood[id] = !state.openFood[id];
      render();
    } else if (action === "set-dinner-opt"){
      state.dinnerOptIdx[el.dataset.day] = Number(el.dataset.idx);
      render();
    } else if (action === "toggle-manual-import"){
      state.showManualImport = !state.showManualImport;
      render();
    } else if (action === "import-manual"){
      const box = document.getElementById("manualImportBox");
      const raw = box ? box.value.trim() : "";
      if (!raw){ state.loadError = "Cole o JSON na caixa antes de importar."; render(); return; }
      let parsed;
      try{
        parsed = JSON.parse(raw);
      } catch(err){
        state.loadError = `JSON inválido: ${err.message}`;
        render();
        return;
      }
      if (!parsed.kcal || !isValidKcalKey(String(parsed.kcal)) || !parsed.menu || Object.keys(parsed.menu).length === 0){
        state.loadError = "Esse JSON não parece ter os campos esperados (kcal, menu preenchido).";
        render();
        return;
      }
      if (!parsed.fasting) parsed.fasting = FASTING_COMMON;
      if (!parsed.period) parsed.period = PERIOD;
      parsed.stats = statsFor(parsed.menu);
      const kcalKey = String(parsed.kcal);

      state.loading = true;
      state.loadProgress = "importando…";
      render();

      await saveDiet(kcalKey, parsed);
      state.customDiets[kcalKey] = parsed;
      state.diets[kcalKey] = parsed;
      state.selectedKcal = kcalKey;
      await saveSelectedKcal(kcalKey);

      let syncErr = "";
      if (SHARED_SYNC_ENABLED){
        const result = await pushSharedDiets(state.customDiets);
        if (!result.ok) syncErr = ` (mas não sincronizou com os outros aparelhos: ${result.error})`;
      }

      state.loading = false;
      state.loadProgress = "";
      state.showManualImport = false;
      state.loadError = null;
      render();
      window.alert(`Dieta de ${Number(kcalKey).toLocaleString('pt-BR')} kcal importada com sucesso!${syncErr}`);
    } else if (action === "select-day"){
      state.selectedDay = el.dataset.day;
      render();
    } else if (action === "select-kcal"){
      state.selectedKcal = el.dataset.kcal;
      await saveSelectedKcal(state.selectedKcal);
      render();
    } else if (action === "open-upload"){
      document.getElementById("pdfInput").click();
    } else if (action === "toggle-manage"){
      state.showManage = !state.showManage;
      render();
    } else if (action === "remove-kcal"){
      const k = el.dataset.kcal;
      delete state.customDiets[k];
      await deleteDiet(k);
      if (BUILTIN_DIETS[k]) state.diets[k] = BUILTIN_DIETS[k];
      else delete state.diets[k];
      if (state.selectedKcal === k) state.selectedKcal = BUILTIN_DIETS[k] ? k : null;
      render();
      const result = await pushSharedDiets(state.customDiets);
      if (!result.ok && SHARED_SYNC_ENABLED){ state.loadError = `Removido aqui, mas não consegui sincronizar com os outros aparelhos agora (${result.error}).`; render(); }
    } else if (action === "register-meal"){
      const input = document.getElementById("mealTimeInput");
      const time = input ? input.value : state.inputTime;
      const entry = { dateKey: todayKey(), time };
      state.lastMeal = entry;
      await saveLastMeal(entry);
      render();
    } else if (action === "clear-meal"){
      state.lastMeal = null;
      await clearLastMeal();
      render();
    } else if (action === "copy-debug"){
      const text = state.debugDumps && state.debugDumps[el.dataset.name];
      if (text){
        try{ await navigator.clipboard.writeText(text); el.textContent = "copiado!"; setTimeout(render, 1200); }
        catch(e){ el.textContent = "toque e segure o texto pra copiar"; }
      }
    } else if (action === "admin-login"){
      const pw = window.prompt("Senha da administradora:");
      if (pw === null) return;
      if (pw === ADMIN_PASSWORD){
        state.isAdmin = true;
        try{ localStorage.setItem("isAdmin", "true"); }catch(e){}
        render();
      } else {
        window.alert("Senha incorreta.");
      }
    } else if (action === "admin-logout"){
      state.isAdmin = false;
      state.showManage = false;
      try{ localStorage.removeItem("isAdmin"); }catch(e){}
      render();
    }
  };

  const pdfInput = document.getElementById("pdfInput");
  if (pdfInput){
    pdfInput.onchange = async (e) => {
      const files = Array.from(e.target.files || []);
      if (files.length === 0) return;
      state.loading = true; state.loadError = null; render();

      const failed = [];
      const debugDumps = {};
      let lastGoodKcal = null;
      let anySucceeded = false;
      for (let i=0; i<files.length; i++){
        const file = files[i];
        const fileTag = files.length > 1 ? `(${i+1}/${files.length}) ` : "";
        state.loadProgress = fileTag;
        render();
        try{
          const lines = await extractLinesFromPdf(file, (m) => {
            if (m && m.status){
              state.loadProgress = `${fileTag}${m.status}`;
              render();
            } else if (m && m.progress != null && m.status === 'recognizing text'){
              state.loadProgress = `${fileTag}ocr ${Math.round(m.progress*100)}%`;
              render();
            }
          });
          const parsed = parseDietText(lines);
          if (!parsed.kcal || !isValidKcalKey(String(parsed.kcal)) || parsed.stats.dayCount === 0){
            failed.push(file.name);
            debugDumps[file.name] = lines.join("\n");
          } else {
            await saveDiet(parsed.kcal, parsed);
            state.customDiets[parsed.kcal] = parsed;
            state.diets[parsed.kcal] = parsed;
            lastGoodKcal = parsed.kcal;
            anySucceeded = true;
          }
        } catch(err){
          console.error(err);
          let msg = "erro desconhecido";
          if (err){
            if (err.message) msg = err.message;
            else if (typeof err === 'string') msg = err;
            else { try{ msg = JSON.stringify(err); }catch(e){ msg = String(err); } }
          }
          failed.push(`${file.name} (${msg})`);
        }
      }

      if (Object.keys(debugDumps).length > 0){
        state.debugDumps = { ...(state.debugDumps||{}), ...debugDumps };
      }

      if (lastGoodKcal){
        state.selectedKcal = lastGoodKcal;
        await saveSelectedKcal(lastGoodKcal);
      }

      let syncFailed = false;
      let syncErrorMsg = "";
      if (anySucceeded && SHARED_SYNC_ENABLED){
        state.loadProgress = "sincronizando pra todo mundo…";
        render();
        const result = await pushSharedDiets(state.customDiets);
        syncFailed = !result.ok;
        syncErrorMsg = result.error || "";
      }

      state.loadError = failed.length
        ? `Não consegui ler: ${failed.join(", ")}. Confira se ${failed.length>1?'são':'é'} o mesmo modelo do programa.`
        : syncFailed
          ? `Salvei aqui, mas não consegui sincronizar com os outros aparelhos agora (${syncErrorMsg}).`
          : null;

      state.loading = false;
      state.loadProgress = "";
      pdfInput.value = "";
      render();
    };
  }
}

/* ================= INIT ================= */
(async function init(){
  render(); // initial empty paint

  // Fast paint from local cache + built-ins first, so the app is usable immediately.
  state.customDiets = await loadAllDiets();
  state.diets = { ...BUILTIN_DIETS, ...state.customDiets };
  state.selectedKcal = await loadSelectedKcal();
  if (state.selectedKcal && !state.diets[state.selectedKcal]) state.selectedKcal = null;
  if (!state.selectedKcal) state.selectedKcal = "1300";
  state.lastMeal = await loadLastMeal();
  try{ state.isAdmin = localStorage.getItem("isAdmin") === "true"; }catch(e){ state.isAdmin = false; }
  render();

  // Then refresh with whatever the shared database has (may be newer than this
  // device's local cache — e.g. another device uploaded a new week's PDF).
  const shared = await fetchSharedDiets();
  if (shared){
    state.customDiets = shared;
    state.diets = { ...BUILTIN_DIETS, ...state.customDiets };
    for (const k of Object.keys(shared)){ await saveDiet(k, shared[k]); } // refresh local cache
    if (state.selectedKcal && !state.diets[state.selectedKcal]) state.selectedKcal = "1300";
    render();
  }

  setInterval(() => { state.now = new Date(); render(); }, 30000);
})();
</script>
